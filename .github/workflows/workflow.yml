name: Main

on:
  push:
    branches: [ main ]
  pull_request: { }

permissions:
  contents: read

jobs:
  required-meta:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: BlindfoldedSurgery/actions-meta/.github/workflows/required.yml@v2

  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@v5.1.1
      - run: terraform fmt -check

  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@v5.1.1
      - run: terraform init -backend=false
      - run: terraform validate

  check-commits:
    permissions:
      contents: read
      pull-requests: write
    uses: BlindfoldedSurgery/actions-releases/.github/workflows/commitizen-check.yml@v6
    with:
      build-tool: uv
      python-version: '3.14'

  bump-version:
    needs:
      - fmt
      - validate
    uses: BlindfoldedSurgery/actions-releases/.github/workflows/commitizen-bump.yml@v6
    permissions:
      contents: write
      pull-requests: write
    with:
      build-tool: uv
      python-version: '3.14'
    secrets:
      GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
